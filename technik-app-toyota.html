<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TechDoklad – Evidencia zákaziek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b0c0e;
    --panel:#141518;
    --panel-alt:#1a1b1e;
    --border:#2a2c30;
    --text:#f5f5f5;
    --text-dim:#8d9096;
    --work:#eb0a1e;
    --work-dim:#3d1116;
    --ok:#2fae60;
    --alert:#eb0a1e;
    --steel:#c9cdd2;
    --display:'Space Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--display);
    height:100%;overflow:hidden;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;
    background:linear-gradient(180deg,#171b21,#14171c 40%);}

  .brand-emblem{width:76px;height:76px;margin:0 auto 14px;position:relative;}
  .brand-emblem svg{width:100%;height:100%;display:block;}
  .brand-emblem-name{text-align:center;font-weight:700;font-size:19px;letter-spacing:1.5px;
    text-transform:uppercase;margin-bottom:2px;}
  .brand-emblem-tag{text-align:center;color:var(--text-dim);font-size:11px;letter-spacing:2px;
    text-transform:uppercase;margin-bottom:26px;}

  .barcode-strip{height:10px;border-radius:2px;
    background:repeating-linear-gradient(-28deg,var(--work) 0 26px,var(--text) 26px 32px,transparent 32px 40px,var(--steel) 40px 46px,transparent 46px 58px);}
  .barcode-strip.dim{height:6px;opacity:.55;
    background:repeating-linear-gradient(-28deg,var(--text-dim) 0 18px,transparent 18px 28px,var(--text-dim) 28px 32px,transparent 32px 44px);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;flex-shrink:0;}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand-name{font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;}
  .brand-name::after{content:'';display:inline-block;width:10px;height:10px;margin-left:7px;background:var(--work);
    clip-path:polygon(0 0,100% 50%,0 100%);vertical-align:middle;}
  .status-dot-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-size:11px;
    padding:6px 10px;border-radius:2px;font-family:var(--display);letter-spacing:.4px;}

  .content{flex:1;overflow-y:auto;padding:6px 18px 18px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;}
  .ticket{position:relative;background:var(--panel-alt);border:1px solid var(--border);border-left:3px solid var(--work);
    border-radius:8px;padding:22px 20px;margin-bottom:16px;overflow:hidden;}
  .ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:20px;height:20px;
    background:var(--bg);border-radius:50%;transform:translateY(-50%);}
  .ticket::before{left:-10px;} .ticket::after{right:-10px;}

  h1.hero{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:.2px;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}

  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 6px;letter-spacing:.3px;}
  input,select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:13px 14px;border-radius:10px;font-size:16px;font-family:var(--display);}
  input:focus,select:focus{outline:2px solid var(--work);border-color:var(--work);}

  button.primary{width:100%;background:var(--work);color:#fff;border:none;padding:15px;border-radius:4px;
    font-size:14px;font-weight:700;font-family:var(--display);margin-top:18px;letter-spacing:.6px;text-transform:uppercase;}
  button.primary:active{transform:scale(.98);}
  button.secondary{width:100%;background:transparent;color:var(--text-dim);border:1px solid var(--border);
    padding:13px;border-radius:4px;font-size:13px;font-family:var(--display);margin-top:10px;letter-spacing:.4px;text-transform:uppercase;}
  button.danger{background:#8f0813;}
  button.ghost-link{background:none;border:none;color:var(--work);font-family:var(--display);font-size:13px;padding:8px;}

  .code-label{font-size:11px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .code-value{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:1px;word-break:break-all;}

  .timer{font-family:var(--mono);font-size:52px;font-weight:700;text-align:center;letter-spacing:2px;
    color:var(--work);margin:14px 0;text-shadow:0 0 22px rgba(235,10,30,.45);font-variant-numeric:tabular-nums;}
  .timer-pulse{animation:tglow 2.4s ease-in-out infinite;}
  @keyframes tglow{0%,100%{text-shadow:0 0 22px rgba(235,10,30,.45)}50%{text-shadow:0 0 34px rgba(235,10,30,.75)}}

  .meta-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:4px;}

  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:230px;margin-bottom:14px;}
  .scan-hint{font-size:12px;color:var(--text-dim);text-align:center;margin:8px 0 16px;}
  .divider-or{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:11px;margin:16px 0;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}

  .log-item{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;}
  .log-item:has(.badge.sent){border-left-color:var(--ok);}
  .log-item:has(.badge.pending){border-left-color:var(--work);}
  .log-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
  .log-code{font-family:var(--mono);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{flex-shrink:0;font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;}
  .badge.sent{background:rgba(51,196,129,.15);color:var(--ok);}
  .badge.pending{background:rgba(235,10,30,.15);color:var(--work);}
  .badge.role-mechanic{background:rgba(201,205,210,.15);color:var(--steel);}
  .badge.role-majster{background:rgba(47,174,96,.15);color:var(--ok);}
  .badge.role-admin{background:rgba(235,10,30,.15);color:var(--work);}
  .badge.paused{background:rgba(201,205,210,.15);color:var(--steel);}
  .ticket.paused{border-left-color:var(--steel);}
  .log-detail{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;}
  .log-delete{color:var(--work);cursor:pointer;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state .barcode-strip{margin:0 auto 18px;width:120px;}

  .navbar{display:flex;border-top:1px solid var(--border);flex-shrink:0;background:var(--panel);}
  .nav-btn{flex:1;background:none;border:none;color:var(--text-dim);font-family:var(--display);
    font-size:11px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .nav-btn.active{color:var(--work);}
  .nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0;}
  .nav-btn.active .nav-dot{opacity:1;}

  .overlay{position:absolute;inset:0;background:rgba(10,12,15,.7);display:flex;align-items:flex-end;
    justify-content:center;z-index:20;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:24px 20px 28px;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;}
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0 0 4px;}

  details{margin-top:16px;}
  summary{color:var(--text-dim);font-size:12px;cursor:pointer;}
  pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;
    font-family:var(--mono);font-size:11px;color:var(--ok);overflow-x:auto;margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'app-state';
const ROLE_LABELS = { admin:'Admin', majster:'Majster', mechanic:'Mechanik' };

let state = {
  currentUser:null,
  users:[],
  activeSessions:{},
  logs:[],
  screen:'login',
  scannerRunning:false,
  pendingCode:'',
  modal:null,
  editingUserId:null,
  deleteUserId:null
};
let qrInstance = null;
let tickInterval = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state.users = saved.users || [];
      state.logs = saved.logs || [];
      state.activeSessions = saved.activeSessions || {};
      state.currentUser = saved.currentUser || null;
      state.screen = routeForCurrentUser();
    }
  }catch(e){ /* no saved state yet, or storage unavailable */ }
  render();
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users:state.users, logs:state.logs, activeSessions:state.activeSessions, currentUser:state.currentUser
    }));
  }catch(e){ console.error('Storage error', e); }
}

function routeForCurrentUser(){
  if(!state.currentUser) return 'login';
  if(state.currentUser.role==='admin') return 'admin';
  if(state.currentUser.role==='majster') return 'overviewLive';
  return mySession() ? 'working' : 'home';
}

function mySession(){
  return state.currentUser ? state.activeSessions[state.currentUser.id] : null;
}

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtElapsed(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function fmtTime(iso){
  const d = new Date(iso);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}

function go(screen){ state.screen = screen; render(); }

function doLogin(){
  const name = document.getElementById('inp-name').value.trim();
  const pin = document.getElementById('inp-pin').value.trim();
  if(!name || !pin){ shakeInvalid('Vyplň meno aj PIN.'); return; }

  if(name.toLowerCase()==='admin' && pin==='admin'){
    state.currentUser = { id:'admin', name:'Admin', role:'admin' };
    persist();
    go(routeForCurrentUser());
    return;
  }
  const match = state.users.find(u => u.name.toLowerCase()===name.toLowerCase() && u.pin===pin);
  if(!match){ shakeInvalid('Nesprávne meno alebo PIN.'); return; }
  state.currentUser = { id:match.id, name:match.name, role:match.role, serverCode:match.serverCode };
  persist();
  go(routeForCurrentUser());
}
function shakeInvalid(msg){
  const c = document.getElementById('login-card');
  const err = document.getElementById('login-error');
  if(err) err.textContent = msg || 'Skontroluj meno a PIN.';
  if(c){ c.style.transition='transform .1s'; c.style.transform='translateX(-6px)';
    setTimeout(()=>{c.style.transform='translateX(6px)';},80);
    setTimeout(()=>{c.style.transform='translateX(0)';},160); }
}
function doLogout(){
  stopScanner();
  clearInterval(tickInterval);
  state.currentUser=null; state.screen='login';
  persist(); render();
}

function openScan(){ state.pendingCode=''; go('scan'); setTimeout(startScanner, 60); }
function startScanner(){
  const el = document.getElementById('reader');
  if(!el || typeof Html5Qrcode === 'undefined') return;
  qrInstance = new Html5Qrcode('reader');
  qrInstance.start(
    { facingMode:'environment' },
    { fps:10, qrbox:{width:230,height:230} },
    (decodedText)=>{ onScanSuccess(decodedText); },
    ()=>{ /* ignore per-frame miss */ }
  ).then(()=>{ state.scannerRunning=true; }).catch(()=>{
    const hint = document.getElementById('cam-hint');
    if(hint) hint.textContent = 'Kamera nie je dostupná v tomto náhľade – zadaj kód ručne nižšie.';
  });
}
function stopScanner(){
  if(qrInstance && state.scannerRunning){
    qrInstance.stop().then(()=>{ qrInstance.clear(); state.scannerRunning=false; }).catch(()=>{});
  }
}
function onScanSuccess(text){
  stopScanner();
  state.pendingCode = text;
  go('confirmStart');
}
function submitManualCode(){
  const v = document.getElementById('manual-code').value.trim();
  if(!v) return;
  stopScanner();
  state.pendingCode = v;
  go('confirmStart');
}
function cancelScan(){ stopScanner(); go('home'); }

function startWork(){
  const uid = state.currentUser.id;
  state.activeSessions[uid] = { code: state.pendingCode, start: new Date().toISOString(), userName: state.currentUser.name, serverCode: state.currentUser.serverCode, paused:false, pausedAt:null };
  persist();
  go('working');
}
function pauseWork(){
  const s = mySession();
  if(!s || s.paused) return;
  s.paused = true;
  s.pausedAt = new Date().toISOString();
  persist();
  render();
}
function resumeWork(){
  const s = mySession();
  if(!s || !s.paused) return;
  const pauseMs = Date.now() - new Date(s.pausedAt).getTime();
  s.start = new Date(new Date(s.start).getTime() + pauseMs).toISOString();
  s.paused = false;
  s.pausedAt = null;
  persist();
  render();
}
function startTicker(){
  clearInterval(tickInterval);
  tickInterval = setInterval(tick, 1000);
  tick();
}
function tick(){
  document.querySelectorAll('[data-start]').forEach(el=>{
    const start = el.getAttribute('data-start');
    const sec = Math.floor((Date.now() - new Date(start).getTime())/1000);
    el.textContent = fmtElapsed(sec);
  });
}
function askStopWork(){ state.modal = 'stop'; render(); }
function closeModal(){ state.modal = null; state.deleteUserId = null; render(); }

function confirmStopWork(){
  const uid = state.currentUser.id;
  const s = state.activeSessions[uid];
  if(!s){ state.modal=null; render(); return; }
  const nowIso = new Date().toISOString();
  const referenceEnd = s.paused ? s.pausedAt : nowIso;
  const durationSec = Math.floor((new Date(referenceEnd).getTime() - new Date(s.start).getTime())/1000);
  const entry = { id:'log_'+Date.now(), userId:uid, userName:state.currentUser.name, serverCode:state.currentUser.serverCode, code:s.code, start:s.start, end:nowIso, durationSec, status:'Odosielam...' };
  state.logs.unshift(entry);
  delete state.activeSessions[uid];
  state.modal = null;
  persist();
  go('home');
  simulateServerSend(entry.id);
}
function simulateServerSend(id){
  setTimeout(()=>{
    const item = state.logs.find(l=>l.id===id);
    if(item){
      item.status = 'Odoslané'; persist();
      if(['history','home','overviewLive','overviewHistory'].includes(state.screen)) render();
    }
  }, 900 + Math.random()*700);
}

function payloadPreview(){
  const s = mySession();
  const example = s ? s : state.logs.find(l=>l.userId===state.currentUser.id);
  const sample = example ? {
    technik: example.serverCode || example.userName, zakazka_kod: example.code,
    zaciatok: example.start, koniec: example.end || null,
    trvanie_sek: example.durationSec ?? null, status: 'ukoncene_alebo_prebieha'
  } : { technik:'...', zakazka_kod:'...', zaciatok:'...', koniec:'...', trvanie_sek:0 };
  return JSON.stringify(sample, null, 2);
}

function openUserForm(userId){
  state.editingUserId = userId || null;
  state.modal = 'userForm';
  render();
}
function closeUserForm(){
  state.modal = null; state.editingUserId = null; render();
}
function saveUserForm(){
  const name = document.getElementById('uf-name').value.trim();
  const pin = document.getElementById('uf-pin').value.trim();
  const role = document.getElementById('uf-role').value;
  const serverCode = document.getElementById('uf-servercode').value.trim();
  if(!name || !pin || !serverCode){ return; }
  if(name.toLowerCase()==='admin'){ alert('Meno "admin" je vyhradené pre administrátorský účet.'); return; }

  if(state.editingUserId){
    const u = state.users.find(x=>x.id===state.editingUserId);
    if(u){ u.name=name; u.pin=pin; u.role=role; u.serverCode=serverCode; }
  } else {
    const dup = state.users.some(u=>u.name.toLowerCase()===name.toLowerCase());
    if(dup){ alert('Používateľ s týmto menom už existuje.'); return; }
    state.users.push({ id:'u_'+Date.now(), name, pin, role, serverCode });
  }
  persist();
  closeUserForm();
}
function askDeleteUser(id){ state.deleteUserId = id; state.modal = 'deleteUser'; render(); }
function confirmDeleteUser(){
  const id = state.deleteUserId;
  state.users = state.users.filter(u=>u.id!==id);
  delete state.activeSessions[id];
  state.modal = null; state.deleteUserId = null;
  persist();
  render();
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  const roleLabel = state.currentUser ? ROLE_LABELS[state.currentUser.role] : '';
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-name">TechDoklad</div>
        <div class="status-dot-row"><span class="status-dot"></span> ${state.currentUser ? escapeHtml(roleLabel)+' · '+escapeHtml(state.currentUser.name) : ''}</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Odhlásiť</button>
    </div>
    <div class="content" id="content">${renderScreen()}</div>
    ${shouldShowNavbar() ? renderNavbar() : ''}
    ${state.modal ? renderModal() : ''}
  `;
  if(state.screen==='working' || state.screen==='overviewLive') startTicker();
  else clearInterval(tickInterval);
}

function shouldShowNavbar(){
  if(!state.currentUser) return false;
  if(state.currentUser.role==='admin') return false;
  if(state.currentUser.role==='mechanic') return !mySession();
  return true;
}

function renderScreen(){
  switch(state.screen){
    case 'home': return renderHome();
    case 'scan': return renderScan();
    case 'confirmStart': return renderConfirmStart();
    case 'working': return renderWorking();
    case 'history': return renderHistory();
    case 'admin': return renderAdmin();
    case 'overviewLive': return renderOverviewLive();
    case 'overviewHistory': return renderOverviewHistory();
    default: return renderHome();
  }
}

function renderLogin(){
  return `
  <div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;">
    <div style="text-align:center;color:#eb0a1e;font-weight:700;font-size:26px;letter-spacing:2px;margin-bottom:6px;">TOYOTA</div>
    <div class="brand-emblem-name">AGMstyl</div>
    <div class="brand-emblem-tag">Evidencia zákaziek</div>
    <div class="barcode-strip" style="margin-bottom:22px;"></div>
    <div id="login-card" class="card">
      <h1 class="hero">Prihlásenie</h1>
      <p class="sub">Zadaj meno a PIN, ktoré ti pridelil administrátor.</p>
      <label>Meno</label>
      <input id="inp-name" type="text" placeholder="napr. Jozef Novák" autocomplete="off">
      <label>PIN / heslo</label>
      <input id="inp-pin" type="password" maxlength="20" placeholder="••••">
      <div id="login-error" style="color:var(--work);font-size:12px;margin-top:10px;min-height:14px;"></div>
      <button class="primary" onclick="doLogin()">Prihlásiť sa</button>
    </div>
    <div class="barcode-strip dim"></div>
  </div>`;
}
function attachLoginEvents(){
  const pin = document.getElementById('inp-pin');
  if(pin) pin.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function renderHome(){
  const myLogs = state.logs.filter(l=>l.userId===state.currentUser.id);
  return `
    <div class="ticket">
      <div class="barcode-strip" style="margin-bottom:16px;"></div>
      <h1 class="hero">Ahoj, ${escapeHtml(state.currentUser.name.split(' ')[0])}</h1>
      <p class="sub">Naskenuj zákazku a potvrď začatie práce.</p>
      <button class="primary" onclick="openScan()">📷 Naskenovať zákazku</button>
    </div>
    <div class="card">
      <div class="code-label">Dnešná aktivita</div>
      <div class="meta-row"><span>Ukončené zákazky</span><span>${myLogs.length}</span></div>
      <div class="meta-row"><span>Odoslané na server</span><span>${myLogs.filter(l=>l.status==='Odoslané').length}</span></div>
    </div>
  `;
}

function renderScan(){
  return `
    <div class="card">
      <div class="code-label">Skenovanie</div>
      <h1 class="hero" style="margin-bottom:14px;">Namier kameru na kód</h1>
      <div id="reader"></div>
      <div class="scan-hint" id="cam-hint">Kód sa naskenuje automaticky po zachytení.</div>
      <div class="divider-or">alebo zadaj ručne</div>
      <label>Kód zákazky / úkonu</label>
      <input id="manual-code" type="text" placeholder="napr. ZAK-2026-0451">
      <button class="primary" onclick="submitManualCode()">Potvrdiť kód</button>
      <button class="secondary" onclick="cancelScan()">Zrušiť</button>
    </div>
  `;
}

function renderConfirmStart(){
  return `
    <div class="ticket">
      <div class="barcode-strip" style="margin-bottom:16px;"></div>
      <div class="code-label">Naskenovaná zákazka</div>
      <div class="code-value">${escapeHtml(state.pendingCode)}</div>
      <p class="sub" style="margin-top:14px;">Potvrď začatie práce – od tohto momentu sa začne merať odpracovaný čas.</p>
      <button class="primary" onclick="startWork()">▶ Začať prácu</button>
      <button class="secondary" onclick="go('scan'); setTimeout(startScanner,60);">Naskenovať iný kód</button>
    </div>
  `;
}

function renderWorking(){
  const s = mySession();
  if(!s) return renderHome();
  const frozenSec = s.paused ? Math.floor((new Date(s.pausedAt).getTime()-new Date(s.start).getTime())/1000) : 0;
  return `
    <div class="ticket ${s.paused?'paused':''}">
      <div class="barcode-strip" style="margin-bottom:16px;"></div>
      <div class="code-label">${s.paused ? 'Práca pozastavená' : 'Prebieha práca na zákazke'}</div>
      <div class="code-value">${escapeHtml(s.code)} ${s.paused ? '<span class="badge paused" style="margin-left:8px;">Pauza</span>' : ''}</div>
      ${s.paused
        ? `<div class="timer">${fmtElapsed(frozenSec)}</div>`
        : `<div class="timer timer-pulse" data-start="${s.start}">00:00:00</div>`}
      <div class="meta-row"><span>Začiatok</span><span>${fmtTime(s.start)}</span></div>
      <div class="meta-row"><span>Technik</span><span>${escapeHtml(state.currentUser.name)}</span></div>
      ${s.paused
        ? `<button class="primary" onclick="resumeWork()">▶ Pokračovať v práci</button>`
        : `<button class="secondary" onclick="pauseWork()">⏸ Pozastaviť prácu</button>`}
      <button class="primary danger" onclick="askStopWork()">■ Ukončiť prácu</button>
    </div>
    <details>
      <summary>Ukážka dát pre server (JSON)</summary>
      <pre>${escapeHtml(payloadPreview())}</pre>
    </details>
  `;
}

function renderHistory(){
  const myLogs = state.logs.filter(l=>l.userId===state.currentUser.id);
  if(myLogs.length===0){
    return `<div class="empty-state"><div class="barcode-strip"></div>Zatiaľ žiadne ukončené zákazky.</div>`;
  }
  return myLogs.map(l=>`
    <div class="log-item">
      <div class="log-top">
        <span class="log-code">${escapeHtml(l.code)}</span>
        <span class="badge ${l.status==='Odoslané'?'sent':'pending'}">${l.status}</span>
      </div>
      <div class="log-detail"><span>${fmtTime(l.start)} – ${fmtTime(l.end)}</span><span>${fmtElapsed(l.durationSec)}</span></div>
    </div>
  `).join('') + `
    <details><summary>Ukážka dát pre server (JSON)</summary><pre>${escapeHtml(payloadPreview())}</pre></details>
  `;
}

function renderOverviewLive(){
  const entries = Object.entries(state.activeSessions);
  if(entries.length===0){
    return `<div class="empty-state"><div class="barcode-strip"></div>Momentálne nikto nepracuje na zákazke.</div>`;
  }
  const workingCount = entries.filter(([,s])=>!s.paused).length;
  const pausedCount = entries.length - workingCount;
  return `<div class="code-label" style="margin:4px 0 12px;">Naživo teraz (${workingCount} pracuje, ${pausedCount} pauza)</div>` +
    entries.map(([uid,s])=>{
      const frozenSec = s.paused ? Math.floor((new Date(s.pausedAt).getTime()-new Date(s.start).getTime())/1000) : 0;
      return `
    <div class="ticket ${s.paused?'paused':''}">
      <div class="code-label">${escapeHtml(s.userName)} ${s.paused ? '<span class="badge paused" style="margin-left:6px;">Pauza</span>' : ''}</div>
      <div class="code-value">${escapeHtml(s.code)}</div>
      ${s.paused
        ? `<div class="timer" style="font-size:32px;margin:10px 0;">${fmtElapsed(frozenSec)}</div>`
        : `<div class="timer" style="font-size:32px;margin:10px 0;" data-start="${s.start}">00:00:00</div>`}
      <div class="meta-row"><span>Začiatok</span><span>${fmtTime(s.start)}</span></div>
    </div>
  `;}).join('');
}

function renderOverviewHistory(){
  if(state.logs.length===0){
    return `<div class="empty-state"><div class="barcode-strip"></div>Zatiaľ žiadne záznamy.</div>`;
  }
  return state.logs.map(l=>`
    <div class="log-item">
      <div class="log-top">
        <span class="log-code">${escapeHtml(l.userName)} · ${escapeHtml(l.code)}</span>
        <span class="badge ${l.status==='Odoslané'?'sent':'pending'}">${l.status}</span>
      </div>
      <div class="log-detail"><span>${fmtTime(l.start)} – ${fmtTime(l.end)}</span><span>${fmtElapsed(l.durationSec)}</span></div>
    </div>
  `).join('');
}

function renderAdmin(){
  const rows = state.users.length ? state.users.map(u=>`
    <div class="log-item" style="cursor:pointer;" onclick="openUserForm('${u.id}')">
      <div class="log-top">
        <span class="log-code">${escapeHtml(u.name)}</span>
        <span class="badge role-${u.role}">${ROLE_LABELS[u.role]}</span>
      </div>
      <div class="log-detail">
        <span>PIN: ${escapeHtml(u.pin)} · Kód: ${escapeHtml(u.serverCode||'—')}</span>
        <span class="log-delete" onclick="event.stopPropagation();askDeleteUser('${u.id}')">Odstrániť</span>
      </div>
    </div>
  `).join('') : `<div class="empty-state"><div class="barcode-strip"></div>Zatiaľ žiadni používatelia.</div>`;
  return `
    <div class="card">
      <div class="code-label">Správa používateľov</div>
      <h1 class="hero" style="margin-bottom:4px;">Používatelia</h1>
      <p class="sub">Vytvor účty pre mechanikov a majstrov. Klikni na účet pre úpravu.</p>
      <button class="primary" onclick="openUserForm()">+ Pridať používateľa</button>
    </div>
    ${rows}
  `;
}

function renderNavbar(){
  const role = state.currentUser.role;
  if(role==='mechanic'){
    return `
      <div class="navbar">
        <button class="nav-btn ${state.screen==='home'?'active':''}" onclick="go('home')">
          <span>⌂ Domov</span><span class="nav-dot"></span>
        </button>
        <button class="nav-btn ${state.screen==='history'?'active':''}" onclick="go('history')">
          <span>📋 História</span><span class="nav-dot"></span>
        </button>
      </div>
    `;
  }
  if(role==='majster'){
    return `
      <div class="navbar">
        <button class="nav-btn ${state.screen==='overviewLive'?'active':''}" onclick="go('overviewLive')">
          <span>● Naživo</span><span class="nav-dot"></span>
        </button>
        <button class="nav-btn ${state.screen==='overviewHistory'?'active':''}" onclick="go('overviewHistory')">
          <span>📋 História</span><span class="nav-dot"></span>
        </button>
      </div>
    `;
  }
  return '';
}

function renderModal(){
  if(state.modal==='stop'){
    const s = mySession();
    if(!s) return '';
    const refTime = s.paused ? s.pausedAt : Date.now();
    const sec = Math.floor((new Date(refTime).getTime()-new Date(s.start).getTime())/1000);
    return `
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Ukončiť prácu na zákazke ${escapeHtml(s.code)}?</h3>
          <p>Odpracovaný čas: <strong style="color:var(--text)">${fmtElapsed(sec)}</strong></p>
          <p>Po potvrdení sa záznam odošle na server.</p>
          <button class="primary danger" onclick="confirmStopWork()">Potvrdiť ukončenie</button>
          <button class="secondary" onclick="closeModal()">Späť</button>
        </div>
      </div>
    `;
  }
  if(state.modal==='userForm'){
    const editing = state.editingUserId ? state.users.find(u=>u.id===state.editingUserId) : null;
    return `
      <div class="overlay" onclick="if(event.target===this) closeUserForm()">
        <div class="modal">
          <h3>${editing ? 'Upraviť používateľa' : 'Nový používateľ'}</h3>
          <label>Meno</label>
          <input id="uf-name" type="text" value="${editing ? escapeHtml(editing.name) : ''}" placeholder="napr. Peter Kováč">
          <label>PIN / heslo</label>
          <input id="uf-pin" type="text" value="${editing ? escapeHtml(editing.pin) : ''}" placeholder="napr. 1234">
          <label>Kód pre server</label>
          <input id="uf-servercode" type="text" value="${editing ? escapeHtml(editing.serverCode||'') : ''}" placeholder="napr. MEC20">
          <p class="sub" style="margin:6px 0 0;">Toto je kód, ktorý sa namiesto mena odošle v dátach na server (technik nikdy neuvidí svoje meno v odosielanom zázname).</p>
          <label>Rola</label>
          <select id="uf-role">
            <option value="mechanic" ${editing&&editing.role==='mechanic'?'selected':''}>Mechanik</option>
            <option value="majster" ${editing&&editing.role==='majster'?'selected':''}>Majster</option>
            <option value="admin" ${editing&&editing.role==='admin'?'selected':''}>Admin</option>
          </select>
          <button class="primary" onclick="saveUserForm()">${editing ? 'Uložiť zmeny' : 'Vytvoriť účet'}</button>
          <button class="secondary" onclick="closeUserForm()">Zrušiť</button>
        </div>
      </div>
    `;
  }
  if(state.modal==='deleteUser'){
    const u = state.users.find(x=>x.id===state.deleteUserId);
    if(!u) return '';
    return `
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Odstrániť používateľa ${escapeHtml(u.name)}?</h3>
          <p>Tento účet sa už nebude môcť prihlásiť. Táto akcia sa nedá vrátiť späť.</p>
          <button class="primary danger" onclick="confirmDeleteUser()">Odstrániť</button>
          <button class="secondary" onclick="closeModal()">Späť</button>
        </div>
      </div>
    `;
  }
  return '';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadState();
</script>
</body>
</html>
