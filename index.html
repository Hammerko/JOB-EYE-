<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JOB EYE – Evidencia zákaziek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#eef1f5;
    --panel:#ffffff;
    --panel-alt:#ffffff;
    --border:#dfe3e9;
    --text:#161a20;
    --text-dim:#6b7280;
    --brand:#2f6fed;
    --brand-dim:#e7effe;
    --start:#17a251;
    --start-dark:#0e7a3c;
    --start-dim:#e5f6ec;
    --pause:#f08c1a;
    --pause-dark:#b3630c;
    --pause-dim:#fdf0e0;
    --end:#e0342c;
    --end-dark:#a3241e;
    --end-dim:#fbe7e6;
    --steel:#8a94a3;
    --ok:#17a251;
    --alert:#e0342c;
    --display:'Space Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--display);
    min-height:100vh;min-height:100dvh;}
  body{display:flex;justify-content:center;}
  #app{width:100%;max-width:480px;display:flex;flex-direction:column;position:relative;
    min-height:100vh;min-height:100dvh;
    background:var(--bg);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}

  .brand-logo{display:block;margin:0 auto 14px;width:220px;max-width:70%;height:auto;}
  .brand-emblem-tag{text-align:center;color:var(--text-dim);font-size:11px;letter-spacing:2px;
    text-transform:uppercase;margin-bottom:26px;}

  .barcode-strip{height:10px;border-radius:2px;
    background:repeating-linear-gradient(-28deg,var(--brand) 0 26px,var(--text) 26px 32px,transparent 32px 40px,var(--steel) 40px 46px,transparent 46px 58px);}
  .barcode-strip.dim{height:6px;opacity:.4;
    background:repeating-linear-gradient(-28deg,var(--text-dim) 0 18px,transparent 18px 28px,var(--text-dim) 28px 32px,transparent 32px 44px);}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 10px;flex-shrink:0;
    position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand-topbar-logo{height:26px;width:auto;display:block;}
  .status-dot-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-size:11px;
    padding:6px 10px;border-radius:2px;font-family:var(--display);letter-spacing:.4px;}

  .content{flex:1;padding:6px 18px 18px;min-width:0;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(20,25,35,.05);}
  .ticket{position:relative;background:var(--panel-alt);border:1px solid var(--border);border-left:3px solid var(--brand);
    border-radius:8px;padding:22px 20px;margin-bottom:16px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,25,35,.05);}
  .ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:20px;height:20px;
    background:var(--bg);border-radius:50%;transform:translateY(-50%);border:1px solid var(--border);}
  .ticket::before{left:-11px;} .ticket::after{right:-11px;}

  h1.hero{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:.2px;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}

  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 6px;letter-spacing:.3px;}
  input,select{width:100%;background:#fff;border:1px solid var(--border);color:var(--text);
    padding:13px 14px;border-radius:10px;font-size:16px;font-family:var(--display);}
  input:focus,select:focus{outline:2px solid var(--brand);border-color:var(--brand);}

  button.primary,button.start,button.pause,button.end{width:100%;color:#fff;border:none;padding:15px;border-radius:4px;
    font-size:14px;font-weight:700;font-family:var(--display);margin-top:18px;letter-spacing:.6px;text-transform:uppercase;}
  button.primary{background:var(--brand);}
  button.start{background:var(--start);}
  button.pause{background:var(--pause);}
  button.end{background:var(--end);}
  button.primary:active,button.start:active,button.pause:active,button.end:active{transform:scale(.98);}
  button.secondary{width:100%;background:transparent;color:var(--text-dim);border:1px solid var(--border);
    padding:13px;border-radius:4px;font-size:13px;font-family:var(--display);margin-top:10px;letter-spacing:.4px;text-transform:uppercase;}
  button.ghost-link{background:none;border:none;color:var(--brand);font-family:var(--display);font-size:13px;padding:8px;}

  .code-label{font-size:11px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .code-value{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:1px;word-break:break-all;}

  .timer{font-family:var(--mono);font-size:52px;font-weight:700;text-align:center;letter-spacing:2px;
    color:var(--start);margin:14px 0;text-shadow:0 0 18px rgba(23,162,81,.25);font-variant-numeric:tabular-nums;}
  .timer.frozen{color:var(--pause);text-shadow:none;}
  .timer-pulse{animation:tglow 2.4s ease-in-out infinite;}
  @keyframes tglow{0%,100%{text-shadow:0 0 18px rgba(23,162,81,.25)}50%{text-shadow:0 0 28px rgba(23,162,81,.5)}}

  .meta-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:4px;}

  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:230px;margin-bottom:14px;}
  .scan-hint{font-size:12px;color:var(--text-dim);text-align:center;margin:8px 0 16px;}
  .divider-or{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:11px;margin:16px 0;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}

  .log-item{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--border);border-radius:6px;
    padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,25,35,.04);}
  .log-item:has(.badge.sent){border-left-color:var(--ok);}
  .log-item:has(.badge.pending){border-left-color:var(--pause);}
  .log-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
  .log-code{font-family:var(--mono);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{flex-shrink:0;font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;}
  .badge.sent{background:var(--start-dim);color:var(--start-dark);}
  .badge.pending{background:var(--pause-dim);color:var(--pause-dark);}
  .badge.role-mechanic{background:#eef0f3;color:var(--steel);}
  .badge.role-majster{background:var(--start-dim);color:var(--start-dark);}
  .badge.role-admin{background:var(--end-dim);color:var(--end-dark);}
  .badge.paused{background:var(--pause-dim);color:var(--pause-dark);}
  .ticket.paused{border-left-color:var(--pause);}
  .log-detail{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;}
  .log-delete{color:var(--end);cursor:pointer;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state .barcode-strip{margin:0 auto 18px;width:120px;}

  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg);border:1px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .photo-time{position:absolute;bottom:3px;left:5px;right:5px;font-size:9px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:var(--mono);}
  .photo-thumb .photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;
    border:none;border-radius:50%;width:19px;height:19px;font-size:11px;line-height:1;padding:0;}

  .navbar{display:flex;border-top:1px solid var(--border);flex-shrink:0;background:var(--panel);
    position:sticky;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom);}
  .nav-btn{flex:1;background:none;border:none;color:var(--text-dim);font-family:var(--display);
    font-size:11px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .nav-btn.active{color:var(--brand);}
  .nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0;}
  .nav-btn.active .nav-dot{opacity:1;}

  .overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:20;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:24px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:480px;
    max-height:88vh;max-height:88dvh;overflow-y:auto;box-shadow:0 -8px 30px rgba(20,25,35,.15);}
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{color:var(--text-dim);font-size:13px;line-height:1.5;margin:0 0 4px;}

  details{margin-top:16px;}
  summary{color:var(--text-dim);font-size:12px;cursor:pointer;}
  pre{background:#12151a;border:1px solid var(--border);border-radius:10px;padding:12px;
    font-family:var(--mono);font-size:11px;color:#5fe08c;overflow-x:auto;margin-top:10px;}
  @media (min-width:640px){
    body{padding:32px 16px;}
    #app{border-radius:22px;border:1px solid var(--border);
      box-shadow:0 30px 80px rgba(20,25,35,.18);overflow:hidden;}
    .topbar{border-radius:22px 22px 0 0;}
  }
  @media (min-width:640px) and (min-height:640px){
    #app{min-height:0;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);}
    .content{overflow-y:auto;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'app-state';
const ROLE_LABELS = { admin:'Admin', majster:'Majster', mechanic:'Mechanik' };

const DEFAULT_SERVER_CONFIG = {
  fields:{
    technik:'technik', zakazka:'zakazka_kod', ukon:'ukony', zaciatok:'zaciatok', koniec:'koniec',
    trvanie:'trvanie_sek', status:'status', udalosti:'udalosti', fotky:'fotografie', fotoCas:'cas'
  },
  statusValues:{ working:'prebieha', paused:'pozastavene', open:'otvorena', sending:'odosielam', sent:'odoslane' }
};

let state = {
  currentUser:null,
  users:[],
  openOrders:{},
  logs:[],
  serverConfig: JSON.parse(JSON.stringify(DEFAULT_SERVER_CONFIG)),
  screen:'login',
  scannerRunning:false,
  modal:null,
  editingUserId:null,
  deleteUserId:null,
  selectedLogId:null
};
let qrInstance = null;
let tickInterval = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state.users = saved.users || [];
      state.logs = saved.logs || [];
      state.openOrders = saved.openOrders || {};
      state.currentUser = saved.currentUser || null;
      if(saved.serverConfig){
        state.serverConfig = {
          fields: Object.assign({}, DEFAULT_SERVER_CONFIG.fields, saved.serverConfig.fields||{}),
          statusValues: Object.assign({}, DEFAULT_SERVER_CONFIG.statusValues, saved.serverConfig.statusValues||{})
        };
      }
      state.screen = routeForCurrentUser();
    }
  }catch(e){ /* no saved state yet, or storage unavailable */ }
  render();
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users:state.users, logs:state.logs, openOrders:state.openOrders,
      currentUser:state.currentUser, serverConfig:state.serverConfig
    }));
  }catch(e){ console.error('Storage error', e); }
}

function routeForCurrentUser(){
  if(!state.currentUser) return 'login';
  if(state.currentUser.role==='admin') return 'admin';
  if(state.currentUser.role==='majster') return 'overviewLive';
  const order = myOrder();
  if(!order) return 'home';
  return order.activeTask ? 'working' : 'orderHub';
}

function myOrder(){
  return state.currentUser ? state.openOrders[state.currentUser.id] : null;
}

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtElapsed(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function fmtTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}

function go(screen){ state.screen = screen; render(); }

function doLogin(){
  const name = document.getElementById('inp-name').value.trim();
  const pin = document.getElementById('inp-pin').value.trim();
  if(!name || !pin){ shakeInvalid('Vyplň meno aj PIN.'); return; }

  if(name.toLowerCase()==='admin' && pin==='admin'){
    state.currentUser = { id:'admin', name:'Admin', role:'admin' };
    persist();
    go(routeForCurrentUser());
    return;
  }
  const match = state.users.find(u => u.name.toLowerCase()===name.toLowerCase() && u.pin===pin);
  if(!match){ shakeInvalid('Nesprávne meno alebo PIN.'); return; }
  state.currentUser = { id:match.id, name:match.name, role:match.role, serverCode:match.serverCode };
  persist();
  go(routeForCurrentUser());
}
function shakeInvalid(msg){
  const c = document.getElementById('login-card');
  const err = document.getElementById('login-error');
  if(err) err.textContent = msg || 'Skontroluj meno a PIN.';
  if(c){ c.style.transition='transform .1s'; c.style.transform='translateX(-6px)';
    setTimeout(()=>{c.style.transform='translateX(6px)';},80);
    setTimeout(()=>{c.style.transform='translateX(0)';},160); }
}
function doLogout(){
  stopScanner();
  clearInterval(tickInterval);
  state.currentUser=null; state.screen='login';
  persist(); render();
}

function openScan(){ go('scanOrder'); setTimeout(startScanner, 60); }
function openTaskScan(){ go('scanTask'); setTimeout(startScanner, 60); }
function getSupportedScanFormats(){
  if(typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  const F = Html5QrcodeSupportedFormats;
  return [
    F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.CODABAR,
    F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.DATA_MATRIX, F.AZTEC
  ];
}
function startScanner(){
  const el = document.getElementById('reader');
  if(!el || typeof Html5Qrcode === 'undefined') return;
  const formats = getSupportedScanFormats();
  qrInstance = new Html5Qrcode('reader', formats ? { formatsToSupport: formats, verbose:false } : undefined);
  qrInstance.start(
    { facingMode:'environment' },
    { fps:10, qrbox:{width:230,height:230} },
    (decodedText)=>{ onScanSuccess(decodedText); },
    ()=>{ /* ignore per-frame miss */ }
  ).then(()=>{ state.scannerRunning=true; }).catch(()=>{
    const hint = document.getElementById('cam-hint');
    if(hint) hint.textContent = 'Kamera nie je dostupná v tomto náhľade – zadaj kód ručne nižšie.';
  });
}
function stopScanner(){
  if(qrInstance && state.scannerRunning){
    qrInstance.stop().then(()=>{ qrInstance.clear(); state.scannerRunning=false; }).catch(()=>{});
  }
}
function onScanSuccess(text){
  stopScanner();
  if(state.screen==='scanOrder'){ openOrder(text); }
  else if(state.screen==='scanTask'){ startTask(text); }
}
function submitManualCode(){
  const inputId = state.screen==='scanTask' ? 'manual-code-task' : 'manual-code-order';
  const input = document.getElementById(inputId);
  const v = input ? input.value.trim() : '';
  if(!v) return;
  stopScanner();
  if(state.screen==='scanOrder'){ openOrder(v); }
  else if(state.screen==='scanTask'){ startTask(v); }
}
function cancelScan(){
  stopScanner();
  if(state.screen==='scanTask'){ go('orderHub'); }
  else { go('home'); }
}

function openOrder(code){
  const uid = state.currentUser.id;
  state.openOrders[uid] = {
    orderCode: code, userName: state.currentUser.name, serverCode: state.currentUser.serverCode,
    openedAt: new Date().toISOString(), photos:[], tasks:[], activeTask:null
  };
  persist();
  go('orderHub');
}
function askCloseOrder(){ state.modal = 'closeOrder'; render(); }
function confirmCloseOrder(){
  const uid = state.currentUser.id;
  const order = state.openOrders[uid];
  if(!order){ state.modal=null; render(); return; }
  if(order.activeTask){ state.modal=null; render(); return; }
  const nowIso = new Date().toISOString();
  const totalDurationSec = (order.tasks||[]).reduce((sum,t)=>sum+(t.durationSec||0),0);
  const entry = {
    id:'order_'+Date.now(), userId:uid, userName:state.currentUser.name, serverCode:state.currentUser.serverCode,
    orderCode:order.orderCode, openedAt:order.openedAt, closedAt:nowIso,
    photos:order.photos||[], tasks:order.tasks||[], totalDurationSec,
    status:'Odosielam...'
  };
  state.logs.unshift(entry);
  delete state.openOrders[uid];
  state.modal = null;
  persist();
  go('home');
  simulateServerSend(entry.id);
}

function startTask(code){
  const order = myOrder();
  if(!order) return;
  const startIso = new Date().toISOString();
  order.activeTask = { taskCode:code, start:startIso, paused:false, pausedAt:null, events:[{type:'start',at:startIso}] };
  persist();
  go('working');
}
function pauseWork(){
  const order = myOrder();
  const t = order ? order.activeTask : null;
  if(!t || t.paused) return;
  t.paused = true;
  t.pausedAt = new Date().toISOString();
  t.events = t.events || [];
  t.events.push({ type:'pause', at:t.pausedAt });
  persist();
  render();
}
function resumeWork(){
  const order = myOrder();
  const t = order ? order.activeTask : null;
  if(!t || !t.paused) return;
  const resumeAt = new Date();
  const pauseMs = resumeAt.getTime() - new Date(t.pausedAt).getTime();
  t.start = new Date(new Date(t.start).getTime() + pauseMs).toISOString();
  t.paused = false;
  t.pausedAt = null;
  t.events = t.events || [];
  t.events.push({ type:'resume', at:resumeAt.toISOString() });
  persist();
  render();
}
function askStopWork(){ state.modal = 'stopTask'; render(); }
function confirmStopTask(){
  const order = myOrder();
  const t = order ? order.activeTask : null;
  if(!order || !t){ state.modal=null; render(); return; }
  const nowIso = new Date().toISOString();
  const referenceEnd = t.paused ? t.pausedAt : nowIso;
  const durationSec = Math.floor((new Date(referenceEnd).getTime() - new Date(t.start).getTime())/1000);
  const events = (t.events || []).concat([{ type:'stop', at:nowIso }]);
  order.tasks = order.tasks || [];
  order.tasks.push({ id:'task_'+Date.now(), taskCode:t.taskCode, start:t.start, end:nowIso, durationSec, events });
  order.activeTask = null;
  state.modal = null;
  persist();
  go('orderHub');
}

function handlePhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      addPhotoToOrder(dataUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function addPhotoToOrder(dataUrl){
  const order = myOrder();
  if(!order) return;
  order.photos = order.photos || [];
  order.photos.push({
    id:'foto_'+Date.now(),
    dataUrl,
    zakazka: order.orderCode,
    mechanikKod: state.currentUser.serverCode || state.currentUser.name,
    cas: new Date().toISOString()
  });
  persist();
  render();
}
function removePhoto(id){
  const order = myOrder();
  if(!order || !order.photos) return;
  order.photos = order.photos.filter(p=>p.id!==id);
  persist();
  render();
}

function startTicker(){
  clearInterval(tickInterval);
  tickInterval = setInterval(tick, 1000);
  tick();
}
function startFullRerenderTicker(){
  clearInterval(tickInterval);
  tickInterval = setInterval(render, 1000);
}
function tick(){
  document.querySelectorAll('[data-start]').forEach(el=>{
    const start = el.getAttribute('data-start');
    const sec = Math.floor((Date.now() - new Date(start).getTime())/1000);
    el.textContent = fmtElapsed(sec);
  });
}
function closeModal(){ state.modal = null; state.deleteUserId = null; render(); }

function simulateServerSend(id){
  setTimeout(()=>{
    const item = state.logs.find(l=>l.id===id);
    if(item){
      item.status = 'Odoslané'; persist();
      if(['history','home','overviewLive','overviewHistory','adminServerLog'].includes(state.screen)) render();
    }
  }, 900 + Math.random()*700);
}

function buildServerPayload(item, kind){
  const cfg = state.serverConfig;
  const out = {};
  out[cfg.fields.technik] = item.serverCode || item.userName;
  out[cfg.fields.zakazka] = item.orderCode;
  out[cfg.fields.zaciatok] = item.openedAt || null;
  out[cfg.fields.koniec] = item.closedAt || null;

  const activeTask = kind==='live' ? item.activeTask : null;
  const tasksSource = (item.tasks || []).concat(activeTask ? [{
    taskCode: activeTask.taskCode,
    start: activeTask.start,
    end: null,
    durationSec: Math.floor((new Date(activeTask.paused ? activeTask.pausedAt : Date.now()).getTime() - new Date(activeTask.start).getTime())/1000),
    events: activeTask.events
  }] : []);

  out[cfg.fields.ukon] = tasksSource.map(t=>({
    kod: t.taskCode,
    [cfg.fields.zaciatok]: t.start,
    [cfg.fields.koniec]: t.end || null,
    [cfg.fields.trvanie]: t.durationSec != null ? t.durationSec : null,
    [cfg.fields.udalosti]: (t.events||[]).map(e=>({ typ:e.type, cas:e.at }))
  }));
  out[cfg.fields.trvanie] = tasksSource.reduce((sum,t)=>sum+(t.durationSec||0), 0);

  let statusVal;
  if(kind==='live'){
    statusVal = activeTask ? (activeTask.paused ? cfg.statusValues.paused : cfg.statusValues.working) : cfg.statusValues.open;
  } else {
    statusVal = item.status==='Odoslané' ? cfg.statusValues.sent : cfg.statusValues.sending;
  }
  out[cfg.fields.status] = statusVal;

  out[cfg.fields.fotky] = (item.photos||[]).map(p=>{
    const photoOut = {};
    photoOut[cfg.fields.zakazka] = p.zakazka;
    photoOut[cfg.fields.technik] = p.mechanikKod;
    photoOut[cfg.fields.fotoCas] = p.cas;
    return photoOut;
  });
  return out;
}

function payloadPreview(){
  const order = myOrder();
  if(order){
    return JSON.stringify(buildServerPayload(order, 'live'), null, 2);
  }
  const example = state.logs.find(l=>l.userId===state.currentUser.id);
  if(example){
    return JSON.stringify(buildServerPayload(example, 'log'), null, 2);
  }
  return JSON.stringify(buildServerPayload({ orderCode:'...', openedAt:new Date().toISOString(), tasks:[], photos:[], activeTask:null }, 'live'), null, 2);
}

function openUserForm(userId){
  state.editingUserId = userId || null;
  state.modal = 'userForm';
  render();
}
function closeUserForm(){
  state.modal = null; state.editingUserId = null; render();
}
function saveUserForm(){
  const name = document.getElementById('uf-name').value.trim();
  const pin = document.getElementById('uf-pin').value.trim();
  const role = document.getElementById('uf-role').value;
  const serverCode = document.getElementById('uf-servercode').value.trim();
  if(!name || !pin || !serverCode){ return; }
  if(name.toLowerCase()==='admin'){ alert('Meno "admin" je vyhradené pre administrátorský účet.'); return; }

  if(state.editingUserId){
    const u = state.users.find(x=>x.id===state.editingUserId);
    if(u){ u.name=name; u.pin=pin; u.role=role; u.serverCode=serverCode; }
  } else {
    const dup = state.users.some(u=>u.name.toLowerCase()===name.toLowerCase());
    if(dup){ alert('Používateľ s týmto menom už existuje.'); return; }
    state.users.push({ id:'u_'+Date.now(), name, pin, role, serverCode });
  }
  persist();
  closeUserForm();
}
function askDeleteUser(id){ state.deleteUserId = id; state.modal = 'deleteUser'; render(); }
function confirmDeleteUser(){
  const id = state.deleteUserId;
  state.users = state.users.filter(u=>u.id!==id);
  delete state.openOrders[id];
  state.modal = null; state.deleteUserId = null;
  persist();
  render();
}

function shouldShowNavbar(){
  if(!state.currentUser) return false;
  if(state.currentUser.role==='admin') return false;

}

function renderScreen(){
  switch(state.screen){
    case 'home': return renderHome();
    case 'scanOrder': return renderScan();
    case 'scanTask': return renderScan();
    case 'orderHub': return renderOrderHub();
    case 'working': return renderWorking();
    case 'history': return renderHistory();
    case 'admin': return renderAdmin();
    case 'adminLive': return renderAdminLive();
    case 'adminServerLog': return renderAdminServerLog();
    case 'adminSettings': return renderAdminSettings();
    case 'overviewLive': return renderOverviewLive();
    case 'overviewHistory': return renderOverviewHistory();
    case 'orderDetail': return renderOrderDetail();
    default: return renderHome();
  }
}

function renderOverviewLive(){
  const entries = Object.entries(state.openOrders);
  if(entries.length===0){
    return `<div class="empty-state"><div class="barcode-strip"></div>Momentálne nemá nikto otvorenú zákazku.</div>`;
  }
  const activeCount = entries.filter(([,o])=>o.activeTask && !o.activeTask.paused).length;
  const pausedCount = entries.filter(([,o])=>o.activeTask && o.activeTask.paused).length;
  const idleCount = entries.length - activeCount - pausedCount;
  return `<div class="code-label" style="margin:4px 0 12px;">Naživo teraz (${activeCount} pracuje, ${pausedCount} pauza, ${idleCount} otvorené bez úkonu)</div>` +
    entries.map(([uid,o])=>{
      const t = o.activeTask;
      const frozenSec = t && t.paused ? Math.floor((new Date(t.pausedAt).getTime()-new Date(t.start).getTime())/1000) : 0;
      return `
    <div class="ticket ${t && t.paused ? 'paused':''}">
      <div class="code-label">${escapeHtml(o.userName)} ${t ? (t.paused ? '<span class="badge paused" style="margin-left:6px;">Pauza</span>' : '') : '<span class="badge role-mechanic" style="margin-left:6px;">Otvorené</span>'}</div>
      <div class="code-value">${escapeHtml(o.orderCode)}</div>

      ${t
        ? (t.paused
            ? `<div class="timer frozen" style="font-size:32px;margin:10px 0;">${fmtElapsed(frozenSec)}</div>`
            : `<div class="timer" style="font-size:32px;margin:10px 0;" data-start="${t.start}">00:00:00</div>`)
        : ''}
      <div class="meta-row"><span>Otvorené od</span><span>${fmtTime(o.openedAt)}</span></div>
      <div class="meta-row"><span>Dokončené úkony</span><span>${(o.tasks||[]).length}</span></div>

  `;}).join('');
}

function renderModal(){
  if(state.modal==='stopTask'){
    const order = myOrder();
    const t = order ? order.activeTask : null;
    if(!t) return '';
    const refTime = t.paused ? t.pausedAt : Date.now();
    const sec = Math.floor((new Date(refTime).getTime()-new Date(t.start).getTime())/1000);
    return `
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Ukončiť úkon ${escapeHtml(t.taskCode)}?</h3>
          <p>Zákazka ${escapeHtml(order.orderCode)} zostane naďalej otvorená.</p>
          <p>Odpracovaný čas: <strong style="color:var(--text)">${fmtElapsed(sec)}</strong></p>
          <button class="end" onclick="confirmStopTask()">Potvrdiť ukončenie úkonu</button>
          <button class="secondary" onclick="closeModal()">Späť</button>
        </div>
      </div>
    `;
  }
  if(state.modal==='closeOrder'){
    const order = myOrder();
    if(!order) return '';
    const totalSec = (order.tasks||[]).reduce((s,t)=>s+(t.durationSec||0),0);
    return `
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Uzavrieť zákazku ${escapeHtml(order.orderCode)}?</h3>
          <p>Dokončené úkony: <strong style="color:var(--text)">${(order.tasks||[]).length}</strong> · Celkový čas: <strong style="color:var(--text)">${fmtElapsed(totalSec)}</strong> · Fotografie: <strong style="color:var(--text)">${(order.photos||[]).length}</strong></p>
          <p>Po uzavretí sa na zákazke už nedá pokračovať a záznam sa odošle na server.</p>
          <button class="end" onclick="confirmCloseOrder()">Potvrdiť uzavretie</button>
          <button class="secondary" onclick="closeModal()">Späť</button>
        </div>
      </div>
    `;
  }
  if(state.modal==='userForm'){
    const editing = state.editingUserId ? state.users.find(u=>u.id===state.editingUserId) : null;
    return `
      <div class="overlay" onclick="if(event.target===this) closeUserForm()">
        <div class="modal">
          <h3>${editing ? 'Upraviť používateľa' : 'Nový používateľ'}</h3>
          <label>Meno</label>
          <input id="uf-name" type="text" value="${editing ? escapeHtml(editing.name) : ''}" placeholder="napr. Peter Kováč">
          <label>PIN / heslo</label>
          <input id="uf-pin" type="text" value="${editing ? escapeHtml(editing.pin) : ''}" placeholder="napr. 1234">
          <label>Kód pre server</label>
          <input id="uf-servercode" type="text" value="${editing ? escapeHtml(editing.serverCode||'') : ''}" placeholder="napr. MEC20">
          <p class="sub" style="margin:6px 0 0;">Toto je kód, ktorý sa namiesto mena odošle v dátach na server (technik nikdy neuvidí svoje meno v odosielanom zázname).</p>
          <label>Rola</label>
          <select id="uf-role">
            <option value="mechanic" ${editing&&editing.role==='mechanic'?'selected':''}>Mechanik</option>
            <option value="majster" ${editing&&editing.role==='majster'?'selected':''}>Majster</option>
            <option value="admin" ${editing&&editing.role==='admin'?'selected':''}>Admin</option>
          </select>
          <button class="primary" onclick="saveUserForm()">${editing ? 'Uložiť zmeny' : 'Vytvoriť účet'}</button>
          <button class="secondary" onclick="closeUserForm()">Zrušiť</button>
        </div>
      </div>
    `;
  }
  if(state.modal==='deleteUser'){
    const u = state.users.find(x=>x.id===state.deleteUserId);
    if(!u) return '';
    return `
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Odstrániť používateľa ${escapeHtml(u.name)}?</h3>
          <p>Tento účet sa už nebude môcť prihlásiť. Táto akcia sa nedá vrátiť späť.</p>
          <button class="end" onclick="confirmDeleteUser()">Odstrániť</button>
          <button class="secondary" onclick="closeModal()">Späť</button>
        </div>
      </div>
    `;
  }
  return '';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
